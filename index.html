<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaxKolok ChatBot | ถาม-ตอบเรื่องวัคซีนเด็กและผู้ใหญ่</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f766e'/%3E%3Cg fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m18 5 1 1'/%3E%3Cpath d='m16.5 8.5 2-2'/%3E%3Cpath d='M18.5 10 9 19.5c-.8.8-2 .8-2.8 0l-.7-.7c-.8-.8-.8-2 0-2.8L15 6.5'/%3E%3Cpath d='m9.5 12.5 3 3'/%3E%3Cpath d='m6 17-2 2'/%3E%3Cpath d='m13.5 5.5 5 5'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --primary:#0f766e;
    --primary-dark:#0b5b54;
    --primary-light:#ccfbf1;
    --bg:#eef4f3;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --user-bubble:#0f766e;
    --bot-bubble:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Sarabun','Noto Sans Thai','Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    display:flex;
    flex-direction:column;
  }
  a{color:var(--primary-dark);}

  header.site-header{
    background:linear-gradient(135deg,var(--primary) 0%,#134e4a 100%);
    color:#fff;
    padding:14px 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    flex-shrink:0;
  }
  .header-inner{
    max-width:820px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-icon{
    width:38px;height:38px;
    background:#fff;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:var(--primary);
    flex-shrink:0;
  }
  .brand-icon svg{width:20px;height:20px;}
  .brand-text h1{
    font-size:16px;margin:0;font-weight:700;
  }
  .brand-text p{
    margin:1px 0 0;font-size:12px;opacity:.85;
  }
  .status-pill{
    margin-inline-start:auto;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    opacity:.9;
  }
  .status-pill .dot{
    width:8px;height:8px;border-radius:50%;background:#4ade80;
  }

  main.chat-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:820px;
    width:100%;
    margin:0 auto;
    min-height:0;
  }

  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:22px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg-row{
    display:flex;
    gap:8px;
    align-items:flex-end;
  }
  .msg-row.user{justify-content:flex-end;}
  .avatar{
    width:30px;height:30px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .avatar svg{width:16px;height:16px;}
  .msg{
    max-width:78%;
    padding:12px 15px;
    border-radius:16px;
    font-size:14.5px;
    white-space:pre-wrap;
    animation:fadeIn .25s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .msg.bot{
    background:var(--bot-bubble);
    color:var(--text);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg.user{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg .src{
    display:block;
    margin-top:10px;
    padding-top:8px;
    border-top:1px dashed #cbd5e1;
    font-size:12px;
    color:var(--muted);
  }
  .msg .src a{color:var(--primary-dark);font-weight:600;}
  .msg .cat-tag{
    display:inline-block;
    background:var(--primary-light);
    color:var(--primary-dark);
    font-size:10.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    margin-bottom:6px;
  }
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
  }
  .suggestions button{
    background:#fff;
    border:1px solid var(--border);
    color:var(--primary-dark);
    padding:6px 12px;
    border-radius:999px;
    font-size:12.5px;
    cursor:pointer;
    transition:.15s;
  }
  .suggestions button:hover{
    background:var(--primary-light);
    border-color:var(--primary);
  }
  .typing-row .msg.bot{
    display:flex;
    gap:4px;
    padding:14px 16px;
    align-items:center;
  }
  .typing-row .msg.bot span{
    width:7px;height:7px;background:#94a3b8;border-radius:50%;
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing-row .msg.bot span:nth-child(2){animation-delay:.15s;}
  .typing-row .msg.bot span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}

  .processing-row .msg.bot{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px 16px;
    font-size:13px;
    color:var(--muted);
    font-style:italic;
    background:#f8fafc;
  }
  .spinner{
    width:14px;height:14px;
    border:2px solid #cbd5e1;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .processing-text{transition:opacity .15s ease;}

  .msg.bot.note-bubble{
    font-size:12.5px;
    color:var(--muted);
    padding:9px 14px;
    background:#f8fafc;
  }
  .msg.bot.note-bubble a{color:var(--primary-dark);font-weight:600;}

  .quick-bar{
    padding:0 16px 6px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .quick-bar button{
    background:#fff;
    border:1px solid var(--border);
    color:var(--primary-dark);
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
  }
  .quick-bar button:hover{background:var(--primary-light);}

  .chat-input-area{
    flex-shrink:0;
    background:#fff;
    border-top:1px solid var(--border);
    padding:12px 16px;
  }
  .chat-input-row{
    display:flex;
    gap:10px;
    max-width:820px;
    margin:0 auto;
  }
  .chat-input-row input{
    flex:1;
    padding:13px 16px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:14.5px;
    font-family:inherit;
    outline:none;
    background:#f8fafc;
  }
  .chat-input-row input:focus{border-color:var(--primary);background:#fff;}
  .chat-input-row button{
    background:var(--primary);
    color:#fff;
    border:none;
    width:46px;height:46px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    transition:.15s;
    flex-shrink:0;
  }
  .chat-input-row button:hover{background:var(--primary-dark);}
  .chat-input-row button:disabled{opacity:.5;cursor:not-allowed;}
  .disclaimer-line{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg></div>
    <div class="brand-text">
      <h1>VaxKolok ChatBot</h1>
      <p>ถามได้ทุกเรื่องเกี่ยวกับวัคซีนเด็กและผู้ใหญ่</p>
    </div>
    <div class="status-pill"><span class="dot"></span> ออนไลน์</div>
  </div>
</header>

<main class="chat-wrap">
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-area">
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="พิมพ์ข้อความ..." autocomplete="off">
      <button id="sendBtn" title="ส่ง">➤</button>
    </div>
    <div class="disclaimer-line">ข้อมูลเพื่อการศึกษาทั่วไป ไม่ใช่คำวินิจฉัยทางการแพทย์ หากมีข้อสงสัยเฉพาะบุคคลควรปรึกษาแพทย์</div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script>
// ฐานข้อมูลคำถาม-คำตอบเรื่องวัคซีน สำหรับ Chatbot
// รวบรวมจากเอกสารอ้างอิงทางการแพทย์และหน่วยงานสาธารณสุข
const VACCINE_QA = [
// 1. ความรู้เกี่ยวกับวัคซีนพื้นฐานในเด็ก
{cat:"วัคซีนพื้นฐานในเด็ก", q:"ทำไมเด็กต้องฉีดวัคซีนตั้งแต่อายุยังน้อย", a:"เด็กเล็กต้องฉีดวัคซีนตั้งแต่อายุน้อย ๆ เพราะภูมิคุ้มกันตามธรรมชาติของเด็กยังไม่แข็งแรงมากพอที่จะป้องกันโรคได้ และโรคติดเชื้อในวัยเด็ก เช่น คอตีบ ไอกรน อาจรุนแรงถึงชีวิต การฉีดวัคซีนช่วยสร้างภูมิคุ้มกันตั้งแต่เนิ่น ๆ เพื่อป้องกันโรคทันเวลาก่อนเด็กจะเสี่ยงติดเชื้อจริง", source:"https://www.nvi.go.th/", sourceLabel:"สถาบันวัคซีนแห่งชาติ"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"วัคซีนแต่ละชนิดมีอันตรายไหม", a:"วัคซีนเด็กที่ใช้อยู่ในประเทศไทยปลอดภัย ผ่านการตรวจสอบมาตรฐานจาก WHO และ อย. ของไทย อันตรายรุนแรงพบได้น้อยมาก ส่วนใหญ่มีเพียงอาการข้างเคียงเล็กน้อย เช่น บวม แดง ปวดตรงที่ฉีด หรือมีไข้ต่ำ ๆ ไม่เกิน 1–2 วัน", source:"https://www.nvi.go.th/", sourceLabel:"สถาบันวัคซีนแห่งชาติ"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"วัคซีนทำงานอย่างไรในการป้องกันโรค", a:"วัคซีนกระตุ้นให้ร่างกายสร้างภูมิคุ้มกันขึ้นเอง (active immunization) ใช้เวลาหลายสัปดาห์ถึงเดือน แบ่งเป็น 3 ชนิดหลัก คือ วัคซีนเชื้อตาย (เช่น ไข้หวัดใหญ่ โปลิโอชนิดฉีด) วัคซีนเชื้อเป็น (เช่น หัด คางทูม หัดเยอรมัน วัณโรค) และวัคซีนจากพิษเชื้อโรคที่หมดฤทธิ์ (เช่น บาดทะยัก คอตีบ) การได้วัคซีนช่วยทั้งตัวผู้รับและสร้างภูมิคุ้มกันหมู่ (herd immunity) ให้สังคม", source:"https://www.rama.mahidol.ac.th/atrama/issue044/rama-rdu", sourceLabel:"คณะแพทยศาสตร์โรงพยาบาลรามาธิบดี"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"เด็กเล็กจำเป็นต้องฉีดวัคซีนทุกตัวที่มีไหม", a:"วัคซีนพื้นฐานเป็นวัคซีนที่เด็กไทยทุกคนควรได้รับ เน้นป้องกันโรคที่เป็นปัญหาสำคัญ ตารางหลักได้แก่ แรกเกิด: BCG, HB1 | 1 เดือน: HB2 (เฉพาะรายเสี่ยง) | 2,4,6 เดือน: DTP-HB-Hib, OPV (4 เดือนมี IPV เพิ่ม) | 9–12 เดือน: MMR1 | 1 ปี: JE1 | 1 ปี 6 เดือน: DTP4, OPV4 | 2 ปี 6 เดือน: MMR2, JE2 | 4 ปี: DTP5, OPV5 | ป.5 (หญิง): HPV | ป.6: dT", source:"https://www.pidst.or.th/A746.html", sourceLabel:"สมาคมโรคติดเชื้อในเด็กแห่งประเทศไทย"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"ถ้าเด็กไม่เคยฉีดวัคซีน จะมีโอกาสติดโรคมากแค่ไหน", a:"เด็กที่ไม่ได้รับวัคซีนมีโอกาสติดโรคสูงกว่า 5–35 เท่า ขึ้นกับชนิดของโรค เช่น โรคหัดหากมีการระบาด เด็กที่ไม่ฉีดวัคซีนมีโอกาสติดเกือบ 90% หากสัมผัสผู้ป่วย ส่วนโรคไอกรน เด็กทารกที่ไม่ฉีดวัคซีนมีโอกาสเสียชีวิตจากภาวะแทรกซ้อนมากกว่า 10 เท่า", source:"https://www.who.int/news/item/15-07-2025-global-childhood-vaccination-coverage-holds-steady-yet-over-14-million-infants-remain-unvaccinated-who-unicef", sourceLabel:"WHO/UNICEF"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"วัคซีนช่วยลดการแพร่กระจายของโรคและการเสียชีวิตได้อย่างไร", a:"1) ปกป้องชีวิต ลดการเจ็บป่วยรุนแรงและเสียชีวิต WHO ระบุว่าวัคซีนช่วยป้องกันโรคได้มากกว่า 30 ชนิด ลดการเสียชีวิต 3.5–5 ล้านคนต่อปี 2) สร้างภูมิคุ้มกันหมู่ ปกป้องผู้ที่ฉีดวัคซีนไม่ได้ เช่น ทารก 3) ลดการแพร่เชื้อในชุมชนจากทั้งประสิทธิภาพ (efficacy) และประสิทธิผล (effectiveness) ของวัคซีน", source:"https://www.who.int/health-topics/vaccines-and-immunization", sourceLabel:"WHO"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"ทำไมต้องฉีดวัคซีนหลายเข็ม และต้องฉีดครบตามโปรแกรมหรือไม่", a:"วัคซีนบางชนิดต้องฉีดหลายเข็มเพื่อสร้างภูมิคุ้มกันที่ยั่งยืน เข็มแรกกระตุ้นให้ร่างกายเริ่มสร้างภูมิคุ้มกัน เข็มที่ 2-3 เสริมให้ภูมิคุ้มกันสูงสุดและคงอยู่นานขึ้น ช่วยสร้าง antibodies ระยะยาวและ memory cells จึงต้องฉีดให้ครบตามโปรแกรมเพื่อการป้องกันที่มีประสิทธิภาพและยั่งยืน", source:"https://www.who.int/news-room/feature-stories/detail/how-do-vaccines-work", sourceLabel:"WHO"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"การฉีดวัคซีนอาจทำให้มีอาการข้างเคียงอะไรบ้าง", a:"อาการที่พบบ่อย (1–3 วันแรกแล้วหายเอง): ปวด/บวม/แดงบริเวณฉีด ไข้ต่ำ งอแงหรือเพลีย ปวดศีรษะ/ปวดเมื่อยเล็กน้อย (ควรเฝ้าดูอาการ 15–30 นาทีหลังฉีดทุกครั้ง) ส่วนอาการที่พบไม่บ่อยแต่ควรพบแพทย์ทันที ได้แก่ ผื่นลมพิษ หน้าบวม หายใจลำบาก (สงสัยแพ้รุนแรง) ไข้สูงมาก/ชัก บวมแดงลุกลามผิดปกติ", source:"https://ddc.moph.go.th/brc/news.php?deptcode=brc&news=17432", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"ถ้าลูกป่วยในช่วงที่ต้องฉีดวัคซีน ควรทำอย่างไร", a:"ป่วยเล็กน้อย (น้ำมูกไหล/ไอเล็กน้อย ไม่มีไข้) มักฉีดได้ แต่ควรแจ้งอาการกับพยาบาล/แพทย์ก่อนฉีดเสมอ ส่วนป่วยระดับปานกลาง-รุนแรง ไข้สูง อาเจียน/ท้องเสียมาก ควรเลื่อนฉีดจนกว่าจะดีขึ้น โดยทั่วไปไม่ต้องเริ่มคอร์สใหม่ ให้ 'นับต่อ' ตามแนวทาง catch-up ยกเว้นบางกรณี เช่น วัคซีนโรต้าที่มีอาเจียน/ท้องเสีย ควรเลื่อนไปก่อน", source:"https://www.ddc.moph.go.th/uploads/publish/1660220250103030656.pdf", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"วัคซีนพื้นฐานในเด็กคืออะไร และป้องกันโรคอะไรบ้าง", a:"BCG → วัณโรครุนแรงในเด็กเล็ก | HepB → ไวรัสตับอักเสบบี/ตับแข็ง/มะเร็งตับ | DTP-HB-Hib → คอตีบ บาดทะยัก ไอกรน ตับอักเสบบี Hib | โปลิโอ (IPV/OPV) → โปลิโออัมพาต | MMR → หัด คางทูม หัดเยอรมัน | JE (LAJE) → ไข้สมองอักเสบเจอี | Rotavirus → ท้องเสียจากไวรัสโรต้า | dT, HPV (วัยเรียน) → บาดทะยัก/คอตีบ และลดเสี่ยงมะเร็งปากมดลูก", source:"https://www.pidst.or.th/A746.html", sourceLabel:"สมาคมโรคติดเชื้อในเด็กแห่งประเทศไทย"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"วัคซีนพื้นฐานของไทยมีการตรวจสอบคุณภาพอย่างไร", a:"1) ต้องขึ้นทะเบียนกับ อย. ซึ่ง WHO ประเมินไว้ระดับ Maturity Level 3 2) ทุกล็อตผ่านการควบคุมคุณภาพโดยกรมวิทยาศาสตร์การแพทย์ (NCL) ก่อนใช้จริง 3) การจัดซื้อภาครัฐกำหนดให้ต้องได้มาตรฐาน GMP และ/หรือ WHO Prequalified 4) มีระบบห่วงโซ่ความเย็น (cold chain) เก็บ/ขนส่งที่ 2–8°C ตลอดสาย", source:"https://www.fda.moph.go.th", sourceLabel:"สำนักงานคณะกรรมการอาหารและยา"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"หากเด็กไม่ได้รับวัคซีนตรงตามกำหนด จะมีความเสี่ยงอย่างไร", a:"1) ขาดภูมิคุ้มกันในช่วงที่เสี่ยงสูง เพราะเด็กเล็กเป็นวัยที่เสี่ยงต่อโรคติดเชื้อหลายชนิด 2) เสี่ยงต่อโรครุนแรงและภาวะแทรกซ้อน เช่น หัดทำให้ปอดบวม/สมองอักเสบ ไอกรนทำให้หายใจลำบากและเสียชีวิตได้ในทารก 3) เพิ่มความเสี่ยงระบาดในชุมชนจากช่องว่างในภูมิคุ้มกันหมู่", source:"https://www.who.int/news-room/fact-sheets/detail/immunization-coverage", sourceLabel:"WHO"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"วัคซีนสามารถฉีดให้เด็กได้ทุกช่วงอายุหรือไม่", a:"ไม่ได้ แต่ละวัคซีนมีช่วงอายุที่เหมาะสมตามการศึกษาทางคลินิก เช่น ทารกแรกเกิดต้องได้ BCG ตับอักเสบบี วัคซีนรวม เด็กโต/วัยเรียนได้เข็มกระตุ้น (DTP, MMR) วัยรุ่นมีวัคซีนเฉพาะ (HPV, Tdap) ส่วนเด็กที่พลาดการฉีดสามารถรับแบบเร่งรัด (catch-up) ตามแนวทาง EPI ของไทย", source:"https://cimjournal.com/idv-article/vaccine68/", sourceLabel:"CIM Journal"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"ภูมิคุ้มกันที่ได้จากวัคซีนจะอยู่ได้นานแค่ไหน", a:"แตกต่างกันตามชนิดวัคซีน บางชนิดอยู่ได้ตลอดชีวิต เช่น หัด หัดเยอรมัน คางทูม เมื่อฉีดครบตามเกณฑ์ บางชนิดอยู่ได้นานหลายปีแต่ต้องกระตุ้นซ้ำ เช่น DTaP/Tdap และบางชนิดอยู่ได้ช่วงสั้นเพราะเชื้อกลายพันธุ์ เช่น ไข้หวัดใหญ่ต้องฉีดทุกปี", source:"https://www.who.int/news-room/questions-and-answers/item/vaccines-and-immunization-what-is-vaccination", sourceLabel:"WHO"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"ถ้าเด็กฉีดวัคซีนครบแล้วยังติดเชื้อได้หรือไม่", a:"แม้ฉีดครบตามเกณฑ์ก็ยังมีโอกาสติดเชื้อได้ (breakthrough infection) โดยเฉพาะโรคที่วัคซีนไม่ให้ภูมิคุ้มกัน 100% แต่หากติดเชื้อ อาการมักไม่รุนแรง และลดความเสี่ยงต่อภาวะเจ็บป่วยรุนแรง", source:"https://www.who.int/news-room/feature-stories/detail/vaccine-efficacy-effectiveness-and-protection", sourceLabel:"WHO"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"เด็กที่ไม่มีอาการแต่เป็นผู้สัมผัสเสี่ยงสูง ต้องได้รับยาหรือไม่", a:"อาจจำเป็นต้องได้รับยาป้องกัน (Post-Exposure Prophylaxis) แม้ยังไม่มีอาการ เช่น โรคไอกรน ผู้สัมผัสใกล้ชิดเสี่ยงสูงควรได้ยาปฏิชีวนะป้องกัน ส่วนโรคหัด อาจต้องฉีด MMR ภายใน 72 ชั่วโมงหลังสัมผัส หรือรับ Immunoglobulin ภายใน 6 วันในกรณีที่ฉีดวัคซีนไม่ได้", source:"https://www.cdc.gov/measles/hcp/vaccine-considerations/index.html", sourceLabel:"CDC"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"หากฉีดวัคซีนแล้วไม่ได้ผลตามคาด ควรทำอย่างไร", a:"1) ตรวจสอบประวัติการได้รับวัคซีนว่าครบตามเกณฑ์หรือไม่ 2) พิจารณาฉีดซ้ำหรือเข็มกระตุ้น (booster) เพราะภูมิคุ้มกันมักลดลงตามเวลา 3) ประเมินปัจจัยส่วนบุคคล เช่น ผู้มีภาวะภูมิคุ้มกันบกพร่องอาจต้องปรับกรณีเฉพาะตามคำแนะนำแพทย์", source:"https://www.who.int/news-room/feature-stories/detail/vaccine-efficacy-effectiveness-and-protection", sourceLabel:"WHO"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"วัคซีนไข้หวัดใหญ่ต้องฉีดทุกปีหรือไม่", a:"WHO ระบุว่าไวรัสไข้หวัดใหญ่มีการวิวัฒนาการเปลี่ยนแปลงสายพันธุ์อยู่เสมอ และภูมิคุ้มกันจากวัคซีนจะลดลงเมื่อเวลาผ่านไป จึงแนะนำให้ฉีดวัคซีนไข้หวัดใหญ่ประจำปี (annual vaccination) เพื่อให้ได้ภูมิคุ้มกันเพียงพอต่อฤดูกาลนั้น", source:"https://www.emro.who.int/health-topics/influenza/influenza-vaccines.html", sourceLabel:"WHO EMRO"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"หากเคยเป็นโรคหัดหรือไอกรนแล้ว ยังต้องฉีดวัคซีนป้องกันหรือไม่", a:"WHO ยังคงแนะนำให้ฉีดวัคซีนตามช่วงอายุตามแผน แม้เคยติดเชื้อมาก่อน เพราะภูมิคุ้มกันจากการติดเชื้อจริงอาจไม่แน่นอน การฉีดวัคซีนตามแผนช่วยสร้างภูมิคุ้มกันที่มีประสิทธิภาพและสนับสนุนภูมิคุ้มกันหมู่ในชุมชนเพิ่มเติมด้วย", source:"https://www.who.int/news-room/fact-sheets/detail/measles", sourceLabel:"WHO"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"เด็กไม่สามารถเดินได้ภายหลังได้รับวัคซีน ควรดำเนินการสอบสวนอย่างไร (AEFI)", a:"หากเด็กไม่สามารถเดินหรือยืนได้หลังได้รับวัคซีน โดยเฉพาะกรณีที่สูญเสียความสามารถที่เคยทำได้ ควรได้รับการประเมินโดยบุคลากรทางการแพทย์โดยเร็ว และควรพิจารณาเป็นเหตุการณ์ไม่พึงประสงค์ภายหลังได้รับวัคซีน (AEFI) เพื่อประเมินสาเหตุและความสัมพันธ์กับวัคซีนอย่างเป็นระบบ เนื่องจากการเกิดเหตุการณ์หลังได้รับวัคซีนไม่ได้หมายความว่าวัคซีนเป็นสาเหตุเสมอไป", source:"https://www.who.int/publications/i/item/9789241516990", sourceLabel:"WHO - คู่มือประเมินสาเหตุ AEFI (ฉบับปรับปรุง 2019)", source2:"https://www.who.int/groups/global-advisory-committee-on-vaccine-safety/topics/aefi/serious-aefi", sourceLabel2:"WHO GACVS - Serious AEFI"},
{cat:"วัคซีนพื้นฐานในเด็ก", q:"ถ้าผู้ปกครองหรือเด็กไม่สามารถไปฉีดวัคซีนในโรงพยาบาลได้ จะทำอย่างไร", a:"สามารถไปรับที่หน่วยปฐมภูมิใกล้บ้าน เช่น รพ.สต./ศูนย์บริการสาธารณสุข/คลินิกเด็กดี ซึ่งให้บริการวัคซีนพื้นฐานทั่วประเทศ ไม่จำเป็นต้องไปโรงพยาบาลใหญ่เสมอไป กรณีมีข้อจำกัดพิเศษ (ติดบ้าน-ติดเตียง/ความพิการ) ให้ประสาน รพ.สต. หรือสาธารณสุขอำเภอเพื่อขอบริการเชิงรุกนอกสถานบริการ", source:"https://www.ddc.moph.go.th/uploads/publish/1660220250103030656.pdf", sourceLabel:"กรมควบคุมโรค"},
// 2. อาการไข้จากวัคซีนพื้นฐานในเด็ก
{cat:"อาการไข้จากวัคซีน", q:"การฉีดวัคซีนทำให้เด็กมีไข้ได้หรือไม่ และเกิดขึ้นบ่อยแค่ไหน", a:"การฉีดวัคซีนสามารถทำให้เด็กมีไข้ได้ ซึ่งเป็นปฏิกิริยาที่ระบบภูมิคุ้มกันตอบสนองต่อวัคซีนเพื่อสร้างภูมิคุ้มกัน อาการไข้มักเกิดขึ้นเฉพาะวัคซีนบางชนิด โดยเฉพาะวัคซีนที่มีเชื้ออ่อนแอหรือเชื้อตาย และโดยทั่วไปไข้มักไม่รุนแรงและหายไปภายใน 1-2 วัน", source:"https://www.cdc.gov/vaccines/vac-gen/side-effects.htm", sourceLabel:"CDC"},
{cat:"อาการไข้จากวัคซีน", q:"ไข้จากวัคซีนจะเกิดจากวัคซีนทุกชนิดหรือไม่", a:"ไข้สามารถเกิดขึ้นได้กับวัคซีนบางชนิด แต่ไม่จำเป็นต้องเกิดกับทุกชนิด วัคซีนที่มีส่วนประกอบของเชื้อตายหรือเชื้ออ่อนแอ (เช่น ไข้หวัดใหญ่ โปลิโอ) มักมีโอกาสทำให้เกิดไข้ได้มากกว่าวัคซีนที่เป็นสารสังเคราะห์ อาการไข้มักไม่รุนแรงและหายไปภายใน 1-2 วัน", source:"https://www.who.int/vaccine_safety/initiative/en/", sourceLabel:"WHO"},
{cat:"อาการไข้จากวัคซีน", q:"ไข้จากวัคซีนเป็นอาการข้างเคียงที่อันตรายหรือไม่ และควรสังเกตอาการอื่นอย่างไร", a:"ไข้จากวัคซีนเป็นอาการปกติที่ไม่อันตราย มักมีไข้ต่ำ ปวด/บวม/แดงที่ฉีด ง่วงนอน อ่อนเพลีย และหายเองใน 1-3 วัน ดูแลด้วยการพักผ่อน ดื่มน้ำ เช็ดตัวลดไข้ และพาราเซตามอลตามคำแนะนำแพทย์ ควรรีบพบแพทย์หากไข้สูงเกิน 39°C ไม่ดีขึ้น มีผื่นลมพิษ หน้าบวม หายใจลำบาก ชัก หรืออาการผิดปกติรุนแรงอื่น ๆ", source:"https://www.cdc.gov/vaccines/hcp/acip-recs/general-recs/adverse-reactions.html", sourceLabel:"CDC"},
{cat:"อาการไข้จากวัคซีน", q:"ไข้จากวัคซีนจะหายไปภายในกี่วัน", a:"โดยทั่วไปแล้วอาการไข้จากวัคซีนจะหายไปเองภายใน 1-3 วันหลังจากฉีดวัคซีน", source:"https://www.childrenhospital.go.th/", sourceLabel:"สถาบันสุขภาพเด็กแห่งชาติมหาราชินี"},
{cat:"อาการไข้จากวัคซีน", q:"หากลูกมีไข้หลังจากฉีดวัคซีน ควรให้ยาลดไข้หรือดูแลอย่างไร", a:"ควรให้พักผ่อน ดื่มน้ำมากๆ เช็ดตัวลดไข้ สวมเสื้อผ้าโปร่งสบาย และประคบเย็นบริเวณที่บวมแดง สามารถให้ยาพาราเซตามอลตามน้ำหนักตัวเมื่อมีไข้ได้ แต่ไม่ควรให้ยาลดไข้ล่วงหน้าเพื่อป้องกันไข้ เพราะมีงานวิจัยชี้ว่าอาจลดประสิทธิภาพของวัคซีนได้ ควรปรึกษาแพทย์/เภสัชกรก่อนใช้ยาเสมอ", source:"https://www.cdc.gov/vaccines/parents/tools/parent-handouts/downloads/how-to-care-for-child.pdf", sourceLabel:"CDC"},
{cat:"อาการไข้จากวัคซีน", q:"มีวิธีป้องกันหรือบรรเทาไข้จากวัคซีนไหม", a:"พักผ่อนให้เพียงพอก่อนและหลังฉีด ดื่มน้ำมากๆ สวมเสื้อผ้าโปร่งสบาย ประคบเย็นบริเวณที่ฉีดหากบวมแดง เช็ดตัวด้วยน้ำอุ่นหากมีไข้ ไม่ควรให้ยาลดไข้ก่อนมีอาการเพื่อป้องกัน แต่ให้เมื่อมีไข้จริงตามขนาด 10-15 มก./กก. ต่อครั้ง ห่างกัน 4-6 ชั่วโมง", source:"https://www.cdc.gov/vaccines/hcp/acip-recs/general-recs/infant-vaccination.html", sourceLabel:"CDC"},
// 3. โรคระบาดที่สามารถป้องกันด้วยวัคซีนพื้นฐานในเด็ก
{cat:"โรคระบาดในเด็ก", q:"สาเหตุของการเกิดโรคระบาดในเด็ก", a:"เกิดจากปัจจัย 3 ด้าน คือ 1) เชื้อโรค (Agent) เช่น ไข้หวัดใหญ่ RSV โรคมือเท้าปาก โรต้า 2) ตัวเด็ก (Host) ที่ภูมิคุ้มกันยังไม่สมบูรณ์และพฤติกรรมใกล้ชิดกัน ขาดสุขอนามัย 3) สิ่งแวดล้อม (Environment) เช่น โรงเรียน ศูนย์เลี้ยงเด็กที่มีเด็กอยู่รวมกันหนาแน่น เอื้อต่อการระบาด", source:"http://ddc.moph.go.th/", sourceLabel:"กรมควบคุมโรค"},
{cat:"โรคระบาดในเด็ก", q:"จังหวัดนราธิวาสทำไมถึงมีการระบาดของโรคในเด็กหลายครั้ง", a:"สาเหตุหลักคือ 1) ความครอบคลุมการฉีดวัคซีนต่ำกว่าเกณฑ์มาตรฐาน ทำให้ขาดภูมิคุ้มกันหมู่ 2) ปัจจัยทางสังคม/ความเชื่อบางอย่างทำให้ผู้ปกครองบางส่วนปฏิเสธวัคซีน 3) พื้นที่ติดชายแดนมาเลเซียทำให้เชื้อโรคแพร่เข้ามาได้ง่าย 4) ปัจจัยด้านสุขาภิบาลในบางพื้นที่", source:"https://ddc.moph.go.th/odpc12/news.php?news=40565&deptcode=odpc12", sourceLabel:"สคร.12 สงขลา กรมควบคุมโรค"},
{cat:"โรคระบาดในเด็ก", q:"พื้นที่ที่มีอัตราการฉีดวัคซีนต่ำจะมีโอกาสเกิดโรคระบาดมากกว่าพื้นที่อื่นหรือไม่", a:"ใช่ พื้นที่ที่มีอัตราการฉีดวัคซีนต่ำจะมีโอกาสเกิดโรคระบาดมากกว่าพื้นที่อื่นอย่างมีนัยสำคัญ เนื่องจากประชากรไม่มีภูมิคุ้มกันหมู่ (herd immunity) เพียงพอต่อการยับยั้งการแพร่กระจายของเชื้อโรค", source:"https://www.ddc.moph.go.th", sourceLabel:"กรมควบคุมโรค"},
{cat:"โรคระบาดในเด็ก", q:"การติดเชื้อทางธรรมชาติก็น่าจะได้รับภูมิคุ้มกันแล้ว ทำไมต้องมาฉีดวัคซีนอีก", a:"แม้เด็กจะเคยติดเชื้อธรรมชาติและมีภูมิคุ้มกัน แต่ระดับภูมิคุ้มกันนี้ไม่ทราบแน่ชัดว่าจะคงอยู่นานแค่ไหนและอาจลดลงตามเวลา จึงควรฉีดวัคซีนพื้นฐานครบตามกำหนดเพื่อกระตุ้นภูมิให้แข็งแรงขึ้น ป้องกันอาการรุนแรง ลดโอกาสติดเชื้อซ้ำ และรับมือเชื้อที่กลายพันธุ์ได้ดีขึ้น", source:"http://ddc.moph.go.th/dcd/pagecontent.php?page=1152&dept=dcd", sourceLabel:"กรมควบคุมโรค"},
{cat:"โรคระบาดในเด็ก", q:"ภูมิคุ้มกันหมู่คืออะไร และทำไมถึงสำคัญ", a:"ภูมิคุ้มกันหมู่คือภาวะที่ประชากรส่วนใหญ่ในพื้นที่มีภูมิคุ้มกันต่อโรคติดต่อ ทำให้การแพร่กระจายของเชื้อโรคถูกจำกัดและไม่สามารถแพร่ไปถึงกลุ่มคนที่ไม่มีภูมิคุ้มกันได้อีก มีความสำคัญเพราะเป็นเกราะป้องกันให้กับผู้ที่ไม่สามารถฉีดวัคซีนได้ เช่น ทารกแรกเกิด ผู้มีภาวะภูมิคุ้มกันบกพร่อง", source:"https://dmh.go.th/news/view.asp?id=2339", sourceLabel:"กรมสุขภาพจิต"},
// 4. ฮาลาล ความเชื่อทางศาสนาอิสลามเกี่ยวกับวัคซีนพื้นฐานในเด็ก
{cat:"ฮาลาลและวัคซีน", q:"วัคซีนที่ฉีดให้เด็กในประเทศไทยมีส่วนประกอบที่ไม่ฮาลาลหรือไม่ และสอดคล้องกับหลักศาสนาอิสลามหรือไม่", a:"วัคซีนป้องกันโรคหัดของกระทรวงสาธารณสุขเป็นวัคซีนที่ฮาลาล ไม่มีสารประกอบของเจลาตินจากสุกร การให้วัคซีนเพื่อป้องกันโรคไม่ได้หมายความว่าขาดการมอบหมายต่ออัลลอฮ์ (อัต-ตะวักกุล) แต่เป็นวิธีป้องกันที่ดำเนินไปพร้อมกับการมอบหมายต่ออัลลอฮ์ ตามคำวินิจฉัย (ฟัตวา) จุฬาราชมนตรีที่ 06/2556", source:"https://skthai.org/uploads/520/filemanager/70a1bfa200eba43e48ca0cc12d1e0114.pdf", sourceLabel:"สำนักจุฬาราชมนตรี"},
{cat:"ฮาลาลและวัคซีน", q:"ถ้าผู้ปกครองต้องการเลือกวัคซีนฮาลาล ควรเลือกอย่างไร", a:"1) สอบถามบุคลากรสาธารณสุขเพื่อความมั่นใจ 2) เชื่อมั่นได้ว่าวัคซีนป้องกันโรคพื้นฐานของกระทรวงสาธารณสุขเป็นวัคซีนที่ฮาลาล", source:"https://www.thaihealth.or.th", sourceLabel:"สำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ (สสส.)"},
{cat:"ฮาลาลและวัคซีน", q:"มีองค์กรใดรับรองว่าวัคซีนในประเทศไทยเป็นฮาลาลหรือไม่", a:"นายแพทย์โนรมาน มูดอ รองผู้อำนวยการโรงพยาบาลศูนย์ยะลา ยืนยันว่ากลุ่มแพทย์มุสลิมในไทยได้ปรึกษาไปยังมาเลเซียและอินโดนีเซียแล้ว และยืนยันกับพี่น้องในพื้นที่ว่าวัคซีนที่กระทรวงสาธารณสุขจัดให้และส่งออกไปทั่วพื้นที่เป็นวัคซีนฮาลาล ไม่มีส่วนผสมของเจลาตินที่เป็นหมู", source:"https://www.thaihealth.or.th", sourceLabel:"สสส."},
{cat:"ฮาลาลและวัคซีน", q:"วัคซีนพื้นฐานในเด็กที่ใช้ในประเทศไทยมีการใช้อย่างแพร่หลายในประเทศมุสลิมหรือไม่", a:"นายแพทย์โนรมาน มูดอ ระบุว่ากลุ่มแพทย์มุสลิมในไทยได้สอบถามพี่น้องในมาเลเซียและอินโดนีเซียแล้ว พบว่าทั่วโลกมีทั้งวัคซีนที่ฮาลาลและไม่ฮาลาล แต่ยืนยันว่าวัคซีนที่กระทรวงสาธารณสุขไทยจัดให้เป็นวัคซีนฮาลาล ไม่มีส่วนผสมของเจลาตินที่เป็นหมู", source:"https://www.thaihealth.or.th", sourceLabel:"สสส."},
// 5. วัคซีนพื้นฐานในเด็กกับประเทศเพื่อนบ้านมาเลเซีย
{cat:"เปรียบเทียบกับมาเลเซีย", q:"หากลูกเคยรับวัคซีนที่มาเลเซียแล้ว ยังสามารถมารับวัคซีนในประเทศไทยต่อได้หรือไม่", a:"ได้ ให้พกสมุด/หลักฐานการรับวัคซีนจากมาเลเซียไปที่หน่วยบริการในไทย แพทย์จะ 'ตามเก็บ (catch-up)' ให้ครบตามเกณฑ์ไทยโดยไม่ต้องเริ่มนับเข็มใหม่ เพียงเว้นช่วงขั้นต่ำครบก็ให้เข็มถัดไปได้ หากไม่มีหลักฐานแน่ชัด แนะนำให้ถือว่าไม่เคยได้รับแล้ววางแผนฉีดใหม่ตามดุลยพินิจแพทย์", source:"https://www.ddc.moph.go.th/uploads/publish/1510320231225092421.pdf", sourceLabel:"กรมควบคุมโรค"},
{cat:"เปรียบเทียบกับมาเลเซีย", q:"การฉีดวัคซีนที่มาเลเซียมีค่าใช้จ่ายหรือไม่", a:"วัคซีนตาม National Immunisation Programme (NIP) ของมาเลเซียให้บริการฟรีสำหรับเด็กสัญชาติมาเลเซียในคลินิกรัฐ (Klinik Kesihatan) หากไปสถานพยาบาลเอกชนหรือรับวัคซีนนอกชุด NIP จะมีค่าใช้จ่ายตามอัตราของสถานพยาบาลนั้น และเด็กต่างชาติในคลินิกรัฐอาจมีค่าธรรมเนียม", source:"https://www.pantai.com.my/medical-specialties/paediatrics/immunisation-schedule-children-malaysia", sourceLabel:"Pantai Hospitals Malaysia"},
{cat:"เปรียบเทียบกับมาเลเซีย", q:"โปรแกรมวัคซีนพื้นฐานของประเทศไทยแตกต่างจากของมาเลเซียหรือไม่", a:"โดยรวมคล้ายกัน (ป้องกันโรคหลักเหมือนกัน) แต่รายละเอียดบางช่วงอายุต่างกัน เช่น ไทยให้ DTP-HB-Hib ที่ 2-4-6 เดือน และ JE ทั่วประเทศที่ 1 ปีและ 2 ปี 6 เดือน ส่วนมาเลเซียให้ DTaP-IPV-Hib ที่ 2-3-5 เดือน ให้ MMR ที่ 9 และ 12 เดือน ให้ JE เฉพาะรัฐซาราวัก และเพิ่มวัคซีนพิวโมคอคคัส (PCV) ในตารางชาติ", source:"https://www.ddc.moph.go.th/uploads/publish/1510320231225092421.pdf", sourceLabel:"กรมควบคุมโรค"},
{cat:"เปรียบเทียบกับมาเลเซีย", q:"การฉีดวัคซีนที่มาเลเซียมีมาตรฐานเทียบเท่ากับของไทยหรือไม่", a:"เทียบเท่ากัน ฝั่งไทย: ระบบกำกับดูแลของ อย. ผ่านการรับรองจาก WHO ระดับ Maturity Level 3 มีระบบเฝ้าระวัง AEFI ฝั่งมาเลเซีย: วัคซีนอยู่ภายใต้การควบคุมโดย NPRA มีระบบ lot-release และเฝ้าระวัง AEFI ระดับชาติเช่นกัน ทั้งสองประเทศจัดหาวัคซีนที่ผ่านมาตรฐานสากล (WHO Prequalification) และดำเนินงานตามกรอบ EPI ของ WHO", source:"https://www.fda.moph.go.th", sourceLabel:"สำนักงานคณะกรรมการอาหารและยา"},
// 6. ความเข้าใจเกี่ยวกับวัคซีนพื้นฐานในเด็กกับปัญหาการพัฒนาทางสติปัญญาของเด็ก
{cat:"วัคซีนกับพัฒนาการเด็ก", q:"การฉีดวัคซีนทำให้เด็กเป็นออทิสติกหรือไม่", a:"ไม่ทำให้เป็นออทิสติก งานวิจัยขนาดใหญ่ทั้งในไทยและต่างประเทศยืนยันตรงกันว่าวัคซีน (รวมถึง MMR) ไม่มีความสัมพันธ์กับการเกิดโรคออทิสติก ความเชื่อดังกล่าวเกิดจากงานวิจัยเล็ก ๆ ที่ไม่ถูกต้องเมื่อกว่า 20 ปีก่อน และถูกถอนออกไปแล้ว", source:"https://ddc.moph.go.th/dvi/news.php?news=25445", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนกับพัฒนาการเด็ก", q:"มีงานวิจัยหรือข้อมูลทางการแพทย์ที่ยืนยันความเชื่อมโยงระหว่างวัคซีนกับออทิสติกหรือไม่", a:"ไม่มี งานวิจัยเชิงระบบ (Systematic review และ Meta-analysis) ที่ศึกษาในเด็กนับล้านคนทั่วโลกพบว่าไม่มีหลักฐานสนับสนุนว่าวัคซีนเกี่ยวข้องกับการเกิดออทิสติก", source:"https://www.thaipediatrics.org", sourceLabel:"ราชวิทยาลัยกุมารแพทย์แห่งประเทศไทย"},
{cat:"วัคซีนกับพัฒนาการเด็ก", q:"การฉีดวัคซีนมีผลกระทบต่อการพัฒนาทางสติปัญญาหรือพัฒนาการของเด็กหรือไม่", a:"ไม่มีหลักฐานว่าวัคซีนทำให้พัฒนาการทางสมองหรือสติปัญญาช้าลง ตรงกันข้าม การได้รับวัคซีนช่วยลดความเสี่ยงจากโรคติดเชื้อรุนแรงที่อาจทำให้เกิดภาวะแทรกซ้อนทางสมอง เช่น เยื่อหุ้มสมองอักเสบ สมองอักเสบ ซึ่งส่งผลเสียต่อพัฒนาการได้", source:"https://anamai.moph.go.th", sourceLabel:"กรมอนามัย"},
{cat:"วัคซีนกับพัฒนาการเด็ก", q:"เหตุใดจึงมีความกังวลในสังคมว่าการฉีดวัคซีนอาจเกี่ยวข้องกับออทิสติก", a:"ความกังวลนี้เริ่มจากงานวิจัยเมื่อปี ค.ศ.1998 ที่อ้างว่าวัคซีน MMR เกี่ยวข้องกับออทิสติก แต่ภายหลังพบว่าเป็นงานวิจัยที่บิดเบือนข้อมูลและถูกถอนออก อย่างไรก็ตามข่าวนี้ยังคงแพร่กระจายผ่านสื่อและโซเชียล จึงทำให้บางครอบครัวยังเข้าใจผิดและกังวล", source:"https://ddc.moph.go.th", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนกับพัฒนาการเด็ก", q:"การฉีดวัคซีนในเด็กจะมีผลต่อความสามารถในการเรียนรู้หรือท่องจำของเด็กหรือไม่", a:"ไม่มีหลักฐานว่าวัคซีนทำให้ความจำหรือการเรียนรู้ของเด็กแย่ลง วัคซีนช่วยป้องกันโรคที่ทำให้เด็กเสี่ยงพิการหรือมีผลต่อสมอง จึงถือว่ามีประโยชน์ต่อการเจริญเติบโตและการเรียนรู้มากกว่า", source:"https://www.nvi.go.th", sourceLabel:"สถาบันวัคซีนแห่งชาติ"},
// 7. เทคนิคการใช้และการจัดเก็บวัคซีนพื้นฐานในเด็ก
{cat:"การจัดเก็บวัคซีน", q:"วัคซีนแต่ละชนิดต้องเก็บที่อุณหภูมิเท่าไหร่", a:"แบ่งเป็น 3 กลุ่ม 1) ไวต่อความเย็นจัด ห้ามแช่แข็ง เช่น DTP, DTP-HB-Hib, HB, dT/Td, IPV, HPV, Influenza, JE เชื้อตาย เก็บ +2 ถึง +8°C 2) ไวต่อแสง เช่น BCG, MMR/MR, LAJE, Rota เก็บ +2 ถึง +8°C ในกล่องกันแสง 3) ไวต่อความร้อนมาก คือ OPV ต้องเก็บช่องแช่แข็ง -15 ถึง -25°C", source:"https://ddc.moph.go.th/uploads/publish/1660220250109080413.pdf", sourceLabel:"กรมควบคุมโรค"},
{cat:"การจัดเก็บวัคซีน", q:"การเก็บวัคซีนในอุณหภูมิที่ไม่เหมาะสมจะทำให้วัคซีนหมดประสิทธิภาพไหม", a:"ใช่ ความร้อน/เย็นจัดทำให้ 'ความแรง (potency)' ของวัคซีนลดลง ส่งผลให้ภูมิคุ้มกันที่เกิดต่ำกว่าที่ควร และการสร้างเสริมภูมิคุ้มกันโรคอาจล้มเหลว", source:"https://www.pidst.or.th", sourceLabel:"สมาคมโรคติดเชื้อในเด็กแห่งประเทศไทย"},
{cat:"การจัดเก็บวัคซีน", q:"วัคซีนที่เก็บในตู้เย็นจะต้องเก็บในอุณหภูมิเท่าไหร่", a:"หลักทั่วไป ชั้นธรรมดาของตู้เย็นเก็บที่ +2 ถึง +8°C ตลอดเวลา ส่วนช่องแช่แข็ง -15 ถึง -25°C ใช้กับบางรายการเท่านั้น (เช่น OPV)", source:"https://ddc.moph.go.th/uploads/publish/1660220250109080413.pdf", sourceLabel:"กรมควบคุมโรค"},
{cat:"การจัดเก็บวัคซีน", q:"วัคซีนต้องฉีดพร้อมกันได้ไหม หรือควรห่างกันกี่วัน", a:"ฉีดพร้อมกันได้หลายชนิดในวันเดียวกัน (คนละตำแหน่ง) ถ้าเป็นวัคซีนเชื้อเป็น 2 ชนิดและไม่ได้ให้พร้อมกัน ควรเว้นอย่างน้อย 4 สัปดาห์ (≈1 เดือน) ก่อนให้ตัวที่สอง ส่วนวัคซีนเชื้อตายให้พร้อมกันหรือเว้นเท่าไรก็ได้", source:"https://pidst.or.th", sourceLabel:"สมาคมโรคติดเชื้อในเด็กแห่งประเทศไทย"},
{cat:"การจัดเก็บวัคซีน", q:"วัคซีนบางตัวสามารถฉีดร่วมกันได้ไหม", a:"ตามหลักทั่วไปฉีดร่วมกันได้เกือบทั้งหมด (เชื้อตาย-เชื้อตาย / เชื้อตาย-เชื้อเป็น) ในวันเดียวกัน โดยฉีดคนละตำแหน่งและบันทึกชนิด-ล็อตให้ชัดเจน กรณีเชื้อเป็น 2 ชนิดถ้าไม่พร้อมกันให้เว้น ≥4 สัปดาห์", source:"https://pidst.or.th", sourceLabel:"สมาคมโรคติดเชื้อในเด็กแห่งประเทศไทย"},
{cat:"การจัดเก็บวัคซีน", q:"วัคซีนพื้นฐานในเด็ก (EPI) แต่ละชนิดควรฉีดห่างกันเท่าไหร่", a:"HB: แรกเกิด-1-6 เดือน (เข็มสุดท้ายเมื่ออายุ ≥24 สัปดาห์) ห่างขั้นต่ำ ≥4 สัปดาห์ | DTP-HB-Hib: 2-4-6 เดือน ห่าง ≥4 สัปดาห์ | โปลิโอ: 2-4-6 เดือน, 18 เดือน, 4 ปี ขั้นต่ำ 4 สัปดาห์ | MMR: เข็ม 1 ที่ 9–12 เดือน เข็ม 2 ที่ 1 ปี 6 เดือน | Rota: เริ่ม 6–15 สัปดาห์ ห่างกัน ≥4 สัปดาห์ จบไม่เกิน 8 เดือน", source:"https://www.pidst.or.th", sourceLabel:"สมาคมโรคติดเชื้อในเด็กแห่งประเทศไทย"},
{cat:"การจัดเก็บวัคซีน", q:"การเก็บวัคซีนในอุณหภูมิที่ไม่เหมาะสมมีผลกระทบอย่างไรต่อประสิทธิภาพ", a:"วัคซีนหมดความแรง/เสื่อมคุณภาพ ส่งผลให้ภูมิคุ้มกันไม่พอ ป้องกันโรคไม่ได้ ตัวอย่างเช่น วัคซีนที่มี Alum ถ้าแช่แข็งจะเสื่อม ส่วน OPV ไวต่อความร้อนมาก ถ้าอุ่นนานจะสูญเสียฤทธิ์", source:"https://www.pidst.or.th", sourceLabel:"สมาคมโรคติดเชื้อในเด็กแห่งประเทศไทย"},
{cat:"การจัดเก็บวัคซีน", q:"วัคซีนที่ใช้ใน EPI จำเป็นต้องเก็บในช่องแช่แข็งหรือไม่", a:"โดยทั่วไปไม่จำเป็น ให้เก็บ +2 ถึง +8°C ยกเว้น OPV ซึ่งมาตรฐานลูกโซ่ความเย็นของไทยกำหนดให้เก็บในช่องแช่แข็ง เนื่องจากไวต่อความร้อนมาก", source:"https://ddc.moph.go.th/uploads/publish/1660220250109080413.pdf", sourceLabel:"กรมควบคุมโรค"},
{cat:"การจัดเก็บวัคซีน", q:"วัคซีนพื้นฐานในเด็ก (EPI) ต้องเก็บที่อุณหภูมิเท่าไหร่ (สรุป)", a:"+2 ถึง +8°C อย่างเคร่งครัดตลอดเวลา เฉพาะ OPV เท่านั้นที่เก็บในช่องแช่แข็งตามมาตรฐานของไทย ส่วนวัคซีนไวต่อความเย็นจัดอื่น ๆ ห้ามแช่แข็ง", source:"https://ddc.moph.go.th/uploads/publish/1660220250109080413.pdf", sourceLabel:"กรมควบคุมโรค"},
// 8. วัคซีนไข้หวัดใหญ่
{cat:"วัคซีนไข้หวัดใหญ่", q:"วัคซีนไข้หวัดใหญ่สามารถป้องกันการติดเชื้อและลดความรุนแรงของโรคได้อย่างไร", a:"วัคซีนกระตุ้นให้ร่างกายสร้างแอนติบอดีต่อไวรัส แม้ป้องกันการติดเชื้อไม่ได้ 100% แต่ลดโอกาสติดเชื้อได้มาก และหากติดเชื้อหลังฉีด อาการมักไม่รุนแรง ลดโอกาสภาวะแทรกซ้อนอย่างปอดบวมหรือเสียชีวิต การฉีดวัคซีนจำนวนมากยังช่วยสร้างภูมิคุ้มกันหมู่ ลดการแพร่กระจายในชุมชน", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"ทำไมต้องฉีดวัคซีนไข้หวัดใหญ่ซ้ำทุกปี", a:"1) ไวรัสไข้หวัดใหญ่กลายพันธุ์เร็ว (antigenic drift) ทำให้ภูมิคุ้มกันปีที่แล้วป้องกันสายพันธุ์ใหม่ได้ไม่ดี 2) วัคซีนแต่ละปีถูกออกแบบให้ตรงกับสายพันธุ์ที่ WHO คาดว่าจะระบาด 3) ภูมิคุ้มกันลดลงเมื่อเวลาผ่านไป การฉีดซ้ำช่วยกระตุ้นภูมิคุ้มกันให้พร้อมป้องกันโรค", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"ใครคือกลุ่มเสี่ยงที่ควรฉีดวัคซีนไข้หวัดใหญ่", a:"1) เด็กเล็กอายุ 6 เดือน–2 ปี 2) ผู้สูงอายุ 65 ปีขึ้นไป 3) หญิงตั้งครรภ์ 4) ผู้ป่วยโรคเรื้อรัง เช่น เบาหวาน หัวใจ ปอด ไต ตับ 5) บุคลากรทางการแพทย์/ผู้ดูแลผู้ป่วย 6) ผู้ที่มีภาวะอ้วนมาก (BMI ≥ 40) 7) ผู้ที่อยู่ในสถานที่แออัด เช่น บ้านพักคนชรา เรือนจำ ศูนย์เลี้ยงเด็ก", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"อาการข้างเคียงที่พบบ่อยจากวัคซีนไข้หวัดใหญ่", a:"บริเวณที่ฉีด: ปวด บวม แดง กดเจ็บ อาการทั่วร่างกาย: ไข้ต่ำ ปวดเมื่อยกล้ามเนื้อ อ่อนเพลีย ปวดศีรษะ หนาวสั่นเล็กน้อย มักหายเองภายใน 1-2 วัน อาการที่ต้องรีบพบแพทย์ (พบน้อยมาก): หายใจลำบาก หน้าบวม คอบวม ผื่นลมพิษ ใจสั่น หน้ามืด", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"ผู้แพ้โปรตีนไข่ฉีดวัคซีนไข้หวัดใหญ่ได้หรือไม่", a:"ได้ ผู้ที่แพ้ไข่เล็กน้อยฉีดได้ตามปกติ ผู้ที่มีประวัติแพ้รุนแรง (เช่น anaphylaxis) ยังสามารถฉีดได้แต่ควรฉีดในสถานพยาบาลที่มีแพทย์พร้อมดูแล และสังเกตอาการอย่างน้อย 30 นาทีหลังฉีด ปัจจุบันมีวัคซีนชนิดที่ไม่ใช้ไข่ในการผลิตด้วย แต่ในไทยยังมีใช้จำกัด", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"หญิงตั้งครรภ์และให้นมบุตรฉีดวัคซีนไข้หวัดใหญ่ได้หรือไม่", a:"ได้อย่างปลอดภัย และเป็นกลุ่มที่แนะนำให้ฉีดเป็นพิเศษ หญิงตั้งครรภ์: แอนติบอดีจากแม่ช่วยป้องกันลูกหลังคลอด 4–6 เดือนแรก หญิงให้นมบุตร: วัคซีนไม่ผ่านทางน้ำนมในรูปแบบที่เป็นอันตราย ใช้วัคซีนชนิดเชื้อตาย (IIV) ไม่ควรใช้ชนิดพ่นจมูกเชื้อเป็นในหญิงตั้งครรภ์", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"วัคซีนไข้หวัดใหญ่ควรฉีดช่วงไหนสำหรับพื้นที่ภาคใต้", a:"ภาคใต้ไม่มีฤดูหนาวชัดเจน แต่ข้อมูลสถิติพบไข้หวัดใหญ่มักระบาดหนักช่วงมิถุนายน-กันยายน จึงแนะนำให้ฉีดวัคซีนช่วงเมษายน-พฤษภาคม (ก่อนเริ่มฤดูฝนและระบาด) ฉีดครั้งเดียวต่อปีก็เพียงพอ กลุ่มเสี่ยงควรฉีดก่อนใคร หลังฉีดประมาณ 2 สัปดาห์จะมีภูมิคุ้มกันเต็มที่", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"ป่วยเป็นหวัดในวันนัดฉีดวัคซีนไข้หวัดใหญ่ควรเลื่อนหรือไม่", a:"แนะนำให้เลื่อนออกไปก่อน เพราะ 1) ร่างกายที่ป่วยอาจตอบสนองต่อวัคซีนได้ไม่เต็มที่ 2) อาจสับสนอาการวัคซีนกับอาการป่วย 3) ลดความเสี่ยงแพร่เชื้อให้ผู้อื่น ควรรอจนอาการดีขึ้นแล้วจึงนัดฉีดใหม่", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"ฉีดวัคซีนไข้หวัดใหญ่พร้อมวัคซีนโควิดหรือวัคซีนอื่นได้หรือไม่", a:"โดยทั่วไปฉีดพร้อมกันได้ WHO และกระทรวงสาธารณสุขไทยอนุญาต สามารถฉีดคนละแขนหรือพร้อมกันในวันเดียวกัน อาจมีอาการข้างเคียงเล็กน้อยแต่ไม่รุนแรง หากมีภูมิคุ้มกันบกพร่องหรือแพ้รุนแรง แพทย์อาจแนะนำเว้นระยะ 1-2 สัปดาห์", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"เพิ่งหายจากไข้หวัดใหญ่ควรรอฉีดวัคซีนไข้หวัดใหญ่นานเท่าไหร่", a:"ควรรอจนกว่าจะหายดีและไม่มีไข้ โดยปกติประมาณ 1-2 สัปดาห์หลังหายป่วย หากยังมีไข้ ไอรุนแรง หรืออ่อนเพลีย ควรเลื่อนออกไปจนฟื้นตัวเต็มที่ ไม่จำเป็นต้องรอนานเป็นเดือน", source:"https://ddc.moph.go.th/disease_detail.php?d=6&t=2", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"จัดเก็บวัคซีนไข้หวัดใหญ่ที่อุณหภูมิเท่าไหร่", a:"เก็บที่ +2 ถึง +8°C ห้ามแช่แข็ง (ต่ำกว่า 0°C จะทำให้โปรตีนในวัคซีนเสื่อมประสิทธิภาพ) ควรเก็บในตู้เย็นเฉพาะสำหรับวัคซีน วางในชั้นกลางหรือชั้นบน ไม่ชิดผนังด้านหลังหรือใกล้ช่องแช่แข็ง และติดตามอุณหภูมิอย่างน้อยวันละ 2 ครั้ง", source:"https://www.cdc.gov", sourceLabel:"CDC"},
{cat:"วัคซีนไข้หวัดใหญ่", q:"วัคซีนไข้หวัดใหญ่ฉีดตำแหน่งใด", a:"ฉีดเข้ากล้ามเนื้อ (Intramuscular) ผู้ใหญ่และเด็กโตฉีดที่กล้ามเนื้อเดลทอยด์ (ต้นแขนด้านบน) ทารกและเด็กเล็กอายุต่ำกว่า 3 ปี ฉีดที่กล้ามเนื้อต้นขาด้านหน้าด้านข้าง ไม่ควรฉีดเข้าก้นเพราะเสี่ยงบาดเจ็บเส้นประสาทและดูดซึมยาไม่ดี", source:"https://www.gangnamclinicth.net/influenza-vaccine/", sourceLabel:"Gangnam Clinic"},
// 9. วัคซีนโควิด-19
{cat:"วัคซีนโควิด-19", q:"ทำไมต้องฉีดกระตุ้นวัคซีนโควิด-19", a:"1) ภูมิคุ้มกันลดลงตามเวลา การฉีดเข็มกระตุ้นช่วยปลุกระบบภูมิคุ้มกันให้กลับมาทำงานเต็มที่ 2) ไวรัสกลายพันธุ์ต่อเนื่อง วัคซีนเข็มกระตุ้นที่ปรับสูตร (เช่น bivalent) ช่วยเพิ่มการป้องกันต่อสายพันธุ์ใหม่ 3) ลดความรุนแรงของโรค ลดความเสี่ยงป่วยหนัก นอนโรงพยาบาล และเสียชีวิต โดยเฉพาะในกลุ่มเสี่ยง", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/booster-shot.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"วัคซีนโควิด-19 ป้องกันป่วยรุนแรงและเสียชีวิตได้อย่างไร", a:"วัคซีนสอนให้เซลล์ภูมิคุ้มกันรู้จักโปรตีนหนาม (spike protein) ของไวรัสโดยไม่ทำให้ติดเชื้อจริง เมื่อร่างกายได้รับเชื้อจริง ระบบภูมิคุ้มกันที่ฝึกฝนแล้วจะตอบสนองรวดเร็วด้วยแอนติบอดีและเซลล์ความจำ เพื่อกำจัดไวรัสก่อนที่จะแพร่กระจายและทำลายเซลล์ร่างกายอย่างรุนแรง", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/effectiveness/why-vaccinate.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"ใครคือกลุ่มเสี่ยงที่ควรได้รับวัคซีนโควิด-19 กระตุ้น", a:"1) ผู้สูงอายุ 60 ปีขึ้นไป 2) ผู้มีโรคประจำตัวเรื้อรัง เช่น เบาหวาน ปอดเรื้อรัง หัวใจ ไต อ้วน ภูมิคุ้มกันบกพร่อง 3) หญิงตั้งครรภ์ 4) บุคลากรทางการแพทย์และสาธารณสุขที่มีความเสี่ยงสัมผัสเชื้อสูง", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/stay-up-to-date.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"เพิ่งใช้ยาต้านไวรัสโควิด-19 ควรรอวัคซีนโควิด-19 หรือไม่", a:"คำแนะนำส่วนใหญ่ระบุว่าควรรออย่างน้อย 90 วัน หลังหายจากอาการป่วยหรือได้รับยาต้านไวรัสครบโดสแล้ว เพื่อให้ร่างกายฟื้นตัวเต็มที่และไม่ให้การตอบสนองของวัคซีนถูกรบกวนจากการติดเชื้อหรือการใช้ยาที่ผ่านมา", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/faq.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"อาการข้างเคียงที่พบบ่อยจากวัคซีนโควิด-19", a:"ปวด บวม แดง หรือคันบริเวณที่ฉีด ก้อนแข็งเล็กๆ ใต้ผิวหนัง อ่อนเพลีย ปวดศีรษะ ปวดเมื่อยกล้ามเนื้อและข้อ ไข้หรือหนาวสั่นคล้ายไข้หวัด คลื่นไส้หรืออาเจียน ส่วนใหญ่ไม่รุนแรงและหายได้เอง", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/expect/after-vaccine.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"ความเสี่ยงกล้ามเนื้อหัวใจอักเสบหลังจากฉีดวัคซีนโควิด-19", a:"ภาวะกล้ามเนื้อหัวใจอักเสบ (Myocarditis) และเยื่อหุ้มหัวใจอักเสบ (Pericarditis) เป็นผลข้างเคียงที่พบได้น้อยมากหลังฉีดวัคซีนชนิด mRNA แม้ต้องเฝ้าระวัง แต่ความเสี่ยงนี้ต่ำกว่าความเสี่ยงที่จะเกิดภาวะเดียวกันจากการติดเชื้อโควิด-19 เองอย่างมีนัยสำคัญ", source:"https://www.cdc.gov/vaccines/covid-19/clinical-considerations/myocarditis.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"หญิงตั้งครรภ์ ให้นม และเด็กเล็กสามารถฉีดวัคซีนโควิด-19 ได้หรือไม่", a:"หญิงตั้งครรภ์ฉีดได้ (แนะนำเมื่ออายุครรภ์ตั้งแต่ 12 สัปดาห์ขึ้นไป) หญิงให้นมบุตรฉีดได้และไม่ต้องหยุดให้นม เด็กเล็กตั้งแต่ 6 เดือนขึ้นไปฉีดได้ในหลายประเทศ โดยเฉพาะกลุ่มที่มีความเสี่ยงสูงต่อโรครุนแรง", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/recommendations/pregnancy.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"ฉีดวัคซีนโควิด-19 แล้วสามารถฉีดวัคซีนไข้หวัดใหญ่ได้หรือไม่", a:"ได้ หน่วยงานสาธารณสุขทั่วโลกยืนยันว่าสามารถฉีดพร้อมกันได้โดยไม่มีข้อห้ามและไม่จำเป็นต้องเว้นระยะห่างระหว่างการฉีด", source:"https://www.cdc.gov/vaccines/covid-19/clinical-considerations/coadministration.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"วัคซีนโควิด-19 เป็นฮาลาลหรือไม่ องค์กรใดรับรอง", a:"วัคซีนโควิด-19 ส่วนใหญ่ได้รับการรับรองว่าเป็นฮาลาล เนื่องจากไม่ได้ใช้วัตถุดิบต้องห้าม (เช่น เจลาตินจากหมู) องค์กรที่รับรอง ได้แก่ Majelis Ulama Indonesia (MUI), Muslim Council of Britain (MCB), Malaysian Islamic Development Department (JAKIM) และสำนักจุฬาราชมนตรีแห่งประเทศไทยที่ออกประกาศให้ชาวมุสลิมไทยฉีดได้", source:"https://www.who.int/emergencies/diseases/novel-coronavirus-2019/advice-for-public/myth-busters", sourceLabel:"WHO"},
{cat:"วัคซีนโควิด-19", q:"จริงหรือไม่ที่วัคซีนโควิด-19 ทำให้มีอาการหลงๆ ลืมๆ", a:"ยังไม่มีหลักฐานชัดเจนว่าเกิดจากวัคซีนโดยตรง หน่วยงานทางการแพทย์ระบุว่าปัญหาความจำ/สมองมักเกิดจากการติดเชื้อโควิดเอง (long COVID) ไม่ใช่วัคซีน ข้อมูลจากไทยพบกลุ่มอาการทางระบบประสาทเฉพาะที่พบได้น้อย (ราว 3 ใน 1,000 คน) และมักหายเองภายใน 7 วัน", source:"https://chulalongkornhospital.go.th", sourceLabel:"โรงพยาบาลจุฬาลงกรณ์"},
{cat:"วัคซีนโควิด-19", q:"จริงหรือไม่ที่วัคซีนโควิด-19 ทำให้ผมร่วง", a:"มีรายงานผมร่วงหลังฉีดวัคซีนในบางคน แต่ไม่ใช่เพราะวัคซีนเป็นสาเหตุโดยตรง เป็นผลจาก Telogen Effluvium ซึ่งเป็นภาวะที่เกิดขึ้นเมื่อร่างกายเผชิญกับความเครียด ไม่ใช่อาการที่ CDC ระบุว่าพบบ่อยหลังฉีดวัคซีน", source:"https://www.aad.org/public/diseases/hair-loss/telogen-effluvium", sourceLabel:"American Academy of Dermatology"},
{cat:"วัคซีนโควิด-19", q:"จริงหรือไม่ที่วัคซีนโควิด-19 ทำให้ร่างกายอ่อนแอ เหนื่อยง่าย", a:"ไม่จริงในระยะยาว อาการอ่อนเพลียเป็นผลข้างเคียงที่พบบ่อยในระยะสั้นหลังฉีด ซึ่งเป็นสัญญาณที่ดีว่าร่างกายกำลังตอบสนองต่อวัคซีนและสร้างภูมิคุ้มกัน งานวิจัยพบว่าผู้ที่มีอาการข้างเคียงมักมีการตอบสนองทางภูมิคุ้มกันที่แข็งแรงกว่า", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/expect/after-vaccine.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"จริงหรือไม่ที่วัคซีนโควิด-19 ทำให้มีอาการภูมิแพ้ง่าย", a:"วัคซีนโควิด-19 ไม่ได้ทำให้คนมีอาการภูมิแพ้ง่ายขึ้นในระยะยาว สิ่งที่อาจเกิดขึ้นได้คืออาการแพ้เฉียบพลัน (anaphylaxis) ซึ่งเป็นผลข้างเคียงที่พบได้น้อยมากหลังฉีดวัคซีน", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/safety/allergic-reaction.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"ติดเชื้อโควิด-19 แล้วก็ยังควรฉีดวัคซีนโควิด-19 หรือไม่", a:"ควรฉีดต่อ เพราะ 1) วัคซีนช่วยกระตุ้นภูมิคุ้มกันให้สูงขึ้นและครอบคลุมสายพันธุ์ต่างๆ ได้ดีกว่า 2) แม้เคยติดเชื้อก็ยังติดเชื้อซ้ำได้ โดยเฉพาะสายพันธุ์ใหม่ 3) ภูมิคุ้มกันจากการติดเชื้อจริงแตกต่างกันในแต่ละคน วัคซีนช่วยให้ภูมิคุ้มกันสม่ำเสมอและคาดการณ์ได้มากกว่า", source:"https://www.cdc.gov/coronavirus/2019-ncov/vaccines/faq.html", sourceLabel:"CDC"},
{cat:"วัคซีนโควิด-19", q:"เก็บรักษา อุณหภูมิ บรรจุภัณฑ์ ขนาด และตำแหน่งฉีดของวัคซีนโควิด-19", a:"mRNA (Pfizer): เก็บ -80 ถึง -60°C หรือในตู้เย็นทั่วไป 2-8°C ได้ระยะหนึ่ง | Moderna: -25 ถึง -15°C หรือ 2-8°C | Viral Vector (AstraZeneca): 2-8°C บรรจุแบบ multi-dose vial ขนาดโดสประมาณ 0.3-0.5 มล. ฉีดเข้ากล้ามเนื้อเดลทอยด์ที่ต้นแขน", source:"https://www.cdc.gov/vaccines/covid-19/info-by-product/index.html", sourceLabel:"CDC"},
// 10. วัคซีน HPV
{cat:"วัคซีน HPV", q:"วัคซีน HPV ป้องกันมะเร็งและโรคใดบ้าง", a:"วัคซีน 2 สายพันธุ์ (Cervarix) ป้องกันสายพันธุ์ 16, 18 ที่เป็นสาเหตุมะเร็งปากมดลูก ป้องกันได้ราว 70% | วัคซีน 4 สายพันธุ์ (Gardasil) ป้องกันสายพันธุ์ 6, 11 (หูดหงอนไก่) และ 16, 18 | วัคซีน 9 สายพันธุ์ (Gardasil 9) ป้องกันสายพันธุ์ 6, 11, 16, 18, 31, 33, 45, 52, 58 ป้องกันมะเร็งปากมดลูก มะเร็งทวารหนัก และหูดหงอนไก่ ครอบคลุมถึง 90%", source:"https://shorturl.asia/HWzYU", sourceLabel:"ข้อมูลวัคซีน HPV"},
{cat:"วัคซีน HPV", q:"ทำไมควรเริ่มฉีดวัคซีน HPV ตั้งแต่อายุ 9–14 ปี", a:"งานวิจัยพบว่าเด็กช่วงอายุ 9-15 ปี ฉีดเพียง 2 เข็มจะได้ประสิทธิภาพเทียบเท่าการฉีด 3 เข็มในผู้ใหญ่ เนื่องจากร่างกายของเด็กวัยนี้สร้างภูมิคุ้มกันต่อไวรัสได้ดี หลายประเทศรวมทั้งไทยจึงรณรงค์ให้เริ่มฉีดตั้งแต่อายุ 9 ปี เพื่อให้ได้ประสิทธิภาพสูงสุด", source:"https://www.paolohospital.com/th-th/center/Article/Details/Article/", sourceLabel:"โรงพยาบาลเปาโล"},
{cat:"วัคซีน HPV", q:"จำเป็นต้องฉีดวัคซีน HPV ทั้งผู้หญิงและผู้ชายหรือไม่", a:"จำเป็น เพราะเชื้อ HPV ก่อโรคได้ทุกเพศทุกวัย ในเพศชายก่อมะเร็งช่องปาก/ลำคอ มะเร็งอวัยวะเพศชาย มะเร็งทวารหนัก และหูดหงอนไก่ ถุงยางอนามัยป้องกันไม่ได้ 100% และเพศชายยังไม่มีคำแนะนำตรวจคัดกรองมะเร็งเหมือนผู้หญิง การฉีดวัคซีนจึงจำเป็นไม่ต่างกัน", source:"https://www.bumrungrad.com/th/health-blog/january-2024/q-a-cervical-cancer", sourceLabel:"โรงพยาบาลบำรุงราษฎร์"},
{cat:"วัคซีน HPV", q:"เด็ก 9–14 ปี ต้องฉีดวัคซีน HPV กี่เข็มและเว้นอย่างไร", a:"วัคซีน HPV 2 หรือ 4 สายพันธุ์ ให้ฉีด 2 ครั้ง ห่างกันอย่างน้อย 6 เดือน ส่วนวัคซีน HPV 9 สายพันธุ์ ฉีดเพียง 1 ครั้ง", source:"https://www.ddc.moph.go.th", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีน HPV", q:"ขาดนัดฉีดวัคซีน HPV นานเท่าไหร่ควรเริ่มใหม่หรือฉีดต่อ", a:"เพื่อประสิทธิภาพสูงสุดควรฉีดวัคซีนชนิดเดียวกันให้ครบคอร์ส (3 เข็มสำหรับผู้ใหญ่อายุ 15 ปีขึ้นไป, 2 เข็มสำหรับอายุ 9-14 ปี ภายใน 1 ปี) หากลืมฉีดหรือเลยกำหนด ปัจจุบันแนะนำว่าฉีดเข็มถัดไปต่อได้เลย ไม่จำเป็นต้องเริ่มต้นใหม่ (no maximum interval) ตามคำแนะนำของ CDC", source:"https://www.bumrungrad.com/th/health-blog/january-2024/q-a-cervical-cancer", sourceLabel:"โรงพยาบาลบำรุงราษฎร์"},
{cat:"วัคซีน HPV", q:"ฉีดวัคซีน HPV แล้วต้องตรวจคัดกรองมะเร็งปากมดลูกหรือไม่", a:"ยังจำเป็นอยู่ แม้ฉีดวัคซีน HPV จะป้องกันมะเร็งปากมดลูกได้ดี แต่การตรวจภายในร่วมกับ Pap smear ยังจำเป็น เพราะการตรวจพบเซลล์ผิดปกติและรักษาตั้งแต่เนิ่นๆ จะช่วยป้องกันการเกิดมะเร็งได้", source:"https://www.thaitravelclinic.com/blog/th/vaccineinfo/thai-hpv-vaccine.html", sourceLabel:"Thai Travel Clinic"},
{cat:"วัคซีน HPV", q:"คัดกรองมะเร็งปากมดลูกควรตรวจเมื่ออายุเท่าไร และบ่อยแค่ไหน", a:"ควรตรวจเมื่ออายุ 30–65 ปี โดยตรวจคัดกรองมะเร็งปากมดลูกทุก 3 ปี", source:"https://www.princsuvarnabhumi.com/articles/content-health-check-by-age", sourceLabel:"โรงพยาบาลพริ้นซ์ สุวรรณภูมิ"},
{cat:"วัคซีน HPV", q:"อาการข้างเคียงที่พบบ่อยของวัคซีน HPV", a:"วัคซีน HPV เป็นวัคซีนชนิดเชื้อตายที่มีความปลอดภัยสูงมาก ใช้กันทั่วโลกและ WHO แนะนำให้ใช้ ผลข้างเคียงส่วนใหญ่ไม่มากและหายเอง เช่น มีไข้ เจ็บปวดบริเวณที่ฉีด หรือปวดเมื่อยตามตัว ผลข้างเคียงหรือการแพ้รุนแรงพบได้น้อยมาก", source:"https://www.thaitravelclinic.com/blog/th/vaccineinfo/thai-hpv-vaccine.html", sourceLabel:"Thai Travel Clinic"},
{cat:"วัคซีน HPV", q:"หญิงตั้งครรภ์ควรเลื่อนการฉีดวัคซีน HPV หรือไม่", a:"แม้วัคซีน HPV จะปลอดภัยสูงสำหรับคนทั่วไป แต่ยังไม่แนะนำให้หญิงตั้งครรภ์เข้ารับวัคซีน เนื่องจากยังไม่มีรายงานความปลอดภัยในช่วงตั้งครรภ์อย่างเพียงพอ ควรปรึกษาแพทย์ก่อนตัดสินใจฉีดวัคซีนใดๆ ระหว่างตั้งครรภ์", source:"https://www.jabandgoclinic.com", sourceLabel:"Jab and Go Clinic"},
{cat:"วัคซีน HPV", q:"ผู้ที่แพ้วัคซีน HPV มักแพ้ส่วนประกอบใด", a:"มักแพ้โปรตีนยีสต์ (ใน Gardasil, Gardasil 9) หรือ Polysorbate 80 / adjuvant อะลูมิเนียม (ใน Cervarix) หากเคยแพ้รุนแรงต่อสารเหล่านี้ ห้ามฉีดวัคซีน HPV", source:"https://ddc.moph.go.th", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีน HPV", q:"วัคซีน HPV ทำให้มีบุตรยากหรือไม่", a:"ไม่ทำให้มีบุตรยาก ผู้หญิงวัยเจริญพันธุ์ที่วางแผนมีบุตรฉีดได้ตามปกติ แนะนำให้ฉีดครบก่อนตั้งครรภ์ หากพบว่าตั้งครรภ์ระหว่างฉีด ควรหยุดเข็มถัดไปก่อนแล้วฉีดต่อหลังคลอดโดยไม่ต้องเริ่มใหม่ วัคซีนไม่เป็นอันตรายต่อทารกในครรภ์ และหญิงให้นมบุตรฉีดได้", source:"https://www.bumrungrad.com/th/health-blog/january-2024/q-a-cervical-cancer", sourceLabel:"โรงพยาบาลบำรุงราษฎร์"},
{cat:"วัคซีน HPV", q:"วัคซีน HPV ทำให้เริ่มเพศสัมพันธ์เร็วขึ้นหรือไม่", a:"ไม่ทำให้เริ่มเพศสัมพันธ์เร็วขึ้น วัคซีน HPV ไม่มีส่วนประกอบที่กระตุ้นความสนใจทางเพศ งานวิจัยระยะยาวในสหรัฐฯ ยุโรป และไทยไม่พบข้อมูลสนับสนุนว่าวัคซีนส่งผลต่อพฤติกรรมทางเพศ การให้ความรู้เรื่องเพศศึกษาควบคู่กับวัคซีนยังช่วยให้เด็กป้องกันตัวเองได้ดีขึ้น", source:"https://ddc.moph.go.th", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีน HPV", q:"วัคซีน HPV ป้องกันได้ทุกสายพันธุ์หรือไม่", a:"ไม่ได้ป้องกันทุกสายพันธุ์ เชื้อ HPV มีมากกว่า 100 สายพันธุ์ โดยมี 14 สายพันธุ์ที่ก่อมะเร็งได้ พบบ่อยที่สุดคือ 16 และ 18 ซึ่งเป็นสาเหตุมะเร็งปากมดลูกถึง 70% ปัจจุบันมีวัคซีน 3 ชนิดให้เลือก คือชนิด 2, 4 และ 9 สายพันธุ์ ซึ่งครอบคลุมสายพันธุ์เสี่ยงสูงมากขึ้นตามลำดับ", source:"https://www.thonburihospital.com/hpv-vaccine-when-and-why/", sourceLabel:"โรงพยาบาลธนบุรี"},
{cat:"วัคซีน HPV", q:"วัคซีน HPV ในไทยสอดคล้องหลักอิสลามหรือไม่", a:"คณะกรรมการกลางอิสลามแห่งประเทศไทย (กอท.) ระบุหลักการว่าถ้าผลิตภัณฑ์ไม่มีส่วนผสมที่หะรอม ถือว่าฮาลาล และกอท. เคยหารือร่วมกับกระทรวงสาธารณสุขและยืนยันว่าวัคซีนที่ใช้ในโครงการป้องกันมะเร็งปากมดลูกในไทยไม่มีส่วนผสมหะรอม", source:"https://ddc.moph.go.th", sourceLabel:"กรมควบคุมโรค"},
{cat:"วัคซีน HPV", q:"วัคซีน HPV เป็นวัคซีนฮาลาลหรือไม่ ดูจากที่ใด", a:"ปัจจุบันวัคซีน HPV ที่ใช้ในโครงการของกระทรวงสาธารณสุข (Cervarix และ Gardasil) ได้รับการยืนยันจากคณะกรรมการกลางอิสลามฯ ว่าไม่มีส่วนประกอบจากสุกร แต่บางรุ่นยังอยู่ระหว่างการพิจารณารับรองฮาลาลเป็นรายผลิตภัณฑ์", source:"https://www.halal.or.th/", sourceLabel:"ศูนย์วิทยาศาสตร์ฮาลาล จุฬาฯ"},
{cat:"วัคซีน HPV", q:"โปรแกรมวัคซีน HPV ของไทย–มาเลเซียต่างกันอย่างไร", a:"ไทย: ฉีดในนักเรียนหญิงชั้น ป.5 (อายุ ~11-12 ปี) เป็นหลัก มี catch-up ให้หญิงไทยอายุ 11-20 ปี ปีการศึกษา 2567 ใช้วัคซีน 9 สายพันธุ์แบบ 1 เข็ม | มาเลเซีย: ฉีดในนักเรียนหญิงชั้น Tingkatan 1 (อายุ ~13 ปี) ปรับเป็น 1 เข็มเช่นกัน ทั้งสองประเทศใช้ระบบฉีดในโรงเรียนเป็นหลักและเน้นกลุ่มเป้าหมายเด็กผู้หญิงในโครงการชาติ", source:"https://spd.moph.go.th/wp-content/uploads/2024/12/5.8-1-HPV-v2.pdf", sourceLabel:"สำนักงานหลักประกันสุขภาพแห่งชาติ"},
{cat:"วัคซีน HPV", q:"วัคซีน HPV ต้องเก็บที่อุณหภูมิเท่าไร ตำแหน่งฉีด ขนาด และคำแนะนำหลังฉีด", a:"เก็บที่อุณหภูมิ +2 ถึง +8°C ห้ามแช่แข็ง ฉีดเข้ากล้ามเนื้อ (Intramuscular) ขนาดมาตรฐาน 0.5 มล. ต่อครั้ง หลังฉีดควรนั่งพักสังเกตอาการอย่างน้อย 30 นาที อาจมีอาการปวดบวมแดงบริเวณที่ฉีด เจ็บ มีไข้ ครั่นเนื้อครั่นตัว ซึ่งเป็นผลข้างเคียงปกติ ไม่มีอันตราย", source:"https://www.pidst.or.th/A555.html", sourceLabel:"สมาคมโรคติดเชื้อในเด็กแห่งประเทศไทย"},

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function wait(ms) { return new Promise(res => setTimeout(res, ms)); }

// ---------- Question logging (for continuous knowledge-base improvement) ----------
// Sends every real question asked (not small talk) to the central log, tagged with
// whether the bot answered confidently, answered with low confidence, or found nothing.
// This never blocks or breaks the chat UX even if logging is unset or the network fails.
function logQuestion(question, status, matchedItem, score) {
  if (!LOG_ENDPOINT_URL) return;
  try {
    fetch(LOG_ENDPOINT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        question: question,
        status: status, // 'matched' | 'uncertain' | 'no_match'
        matchedQuestion: matchedItem ? matchedItem.q : '',
        category: matchedItem ? matchedItem.cat : '',
        score: (score !== undefined && score !== null) ? Number(score.toFixed(3)) : '',
        page: location.href,
        time: new Date().toISOString()
      })
    }).catch(() => {});
  } catch (e) { /* logging must never break the chat */ }
}

function isGreeting(text) {
  return /^(สวัสดี|หวัดดี|หวัดดีครับ|หวัดดีค่ะ|hello|hi|hey)\b|^(สวัสดี|หวัดดี)/i.test(text.trim());
}
function isThanks(text) {
  return /ขอบคุณ|ขอบใจ|thank/i.test(text);
}
function isBye(text) {
  return /^(บาย|ลาก่อน|บ๊ายบาย|bye|goodbye)/i.test(text.trim());
}

// ---------- Message rendering ----------
function scrollToBottom() {
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function addUserMessage(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="msg user"></div>`;
  row.querySelector('.msg').textContent = text;
  chatMessages.appendChild(row);
  scrollToBottom();
}

function addBotMessageInstant(html, extraClass) {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `<div class="avatar">${AVATAR_SVG}</div><div class="msg bot${extraClass ? ' ' + extraClass : ''}"></div>`;
  row.querySelector('.msg').innerHTML = html;
  chatMessages.appendChild(row);
  scrollToBottom();
  return row;
}

// Typewriter effect: reveals plain text progressively
function addBotMessageTyped(plainText) {
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="avatar">${AVATAR_SVG}</div><div class="msg bot"></div>`;
    const bubble = row.querySelector('.msg');
    chatMessages.appendChild(row);
    scrollToBottom();

    let i = 0;
    const step = Math.max(1, Math.round(plainText.length / 45));
    const timer = setInterval(() => {
      i += step;
      bubble.textContent = plainText.slice(0, i);
      scrollToBottom();
      if (i >= plainText.length) {
        clearInterval(timer);
        bubble.textContent = plainText;
        scrollToBottom();
        resolve(row);
      }
    }, 16);
  });
}

function showDotTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot typing-row';
  row.id = 'typingIndicator';
  row.innerHTML = `<div class="avatar">${AVATAR_SVG}</div><div class="msg bot"><span></span><span></span><span></span></div>`;
  chatMessages.appendChild(row);
  scrollToBottom();
}
function hideDotTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

// Shows a sequence of "processing" status lines (simulates the bot working through the question)
function showProcessing(stepCount) {
  return new Promise(resolve => {
    const row = document.createElement('div');
    row.className = 'msg-row bot processing-row';
    row.id = 'processingIndicator';
    row.innerHTML = `<div class="avatar">${AVATAR_SVG}</div><div class="msg bot"><span class="spinner"></span><span class="processing-text"></span></div>`;
    chatMessages.appendChild(row);
    const textEl = row.querySelector('.processing-text');
    scrollToBottom();

    const steps = PROCESSING_STEPS.slice(0, stepCount);
    let idx = 0;
    textEl.style.opacity = 1;
    textEl.textContent = steps[0];

    const interval = setInterval(() => {
      idx++;
      if (idx < steps.length) {
        textEl.style.opacity = 0;
        setTimeout(() => {
          textEl.textContent = steps[idx];
          textEl.style.opacity = 1;
          scrollToBottom();
        }, 150);
      } else {
        clearInterval(interval);
        row.remove();
        resolve();
      }
    }, 620);
  });
}

function bindSuggestionButtons(container) {
  container.querySelectorAll('.suggestions button[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = VACCINE_QA[parseInt(btn.dataset.idx)];
      addUserMessage(item.q);
      logQuestion(item.q, 'matched', item, 0);
      runAnswerFlow(item, false);
    });
  });
  container.querySelectorAll('.suggestions button[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      addUserMessage(`อยากรู้เรื่อง${btn.dataset.cat}`);
      respondWithCategory(btn.dataset.cat);
    });
  });
}

// ---------- Core response flow: processing -> empathy bubble -> typed answer -> source note -> follow-up ----------
async function runAnswerFlow(item, uncertain) {
  // Step 1: visible "processing" sequence (feels like real thinking/research)
  await showProcessing(uncertain ? 4 : 3);
  await wait(200);

  // Step 2: short conversational acknowledgment bubble
  const empathyBank = CATEGORY_EMPATHY[item.cat] || GENERIC_EMPATHY;
  const opener = uncertain ? pick(UNCERTAIN_OPENERS) : pick(empathyBank);
  addBotMessageInstant(opener);
  await wait(550 + Math.random() * 350);

  // Step 3: typed main answer
  showDotTyping();
  await wait(500 + Math.random() * 400);
  hideDotTyping();
  await addBotMessageTyped(item.a);
  await wait(300);

  // Step 4: source note as its own small bubble
  addBotMessageInstant(
    `📎 แหล่งอ้างอิง: <a href="${item.source}" target="_blank" rel="noopener">${item.sourceLabel}</a>`,
    'note-bubble'
  );
  await wait(650);

  // Step 5: follow-up + related suggestions
  showDotTyping();
  await wait(450);
  hideDotTyping();
  const results = fuse.search(item.q).filter(r => r.item !== item).slice(0, 3);
  let html = pick(FOLLOW_UPS);
  if (results.length > 0) {
    html += `<br><span style="color:#94a3b8;font-size:12.5px;">${pick(RELATED_LEADS)}</span>`;
    html += `<div class="suggestions">`;
    results.forEach(r => {
      html += `<button data-idx="${VACCINE_QA.indexOf(r.item)}">${r.item.q}</button>`;
    });
    html += `</div>`;
  }
  const row = addBotMessageInstant(html);
  bindSuggestionButtons(row);
}

function respondWithCategory(cat) {
  showDotTyping();
  setTimeout(() => {
    hideDotTyping();
    const items = VACCINE_QA.filter(x => x.cat === cat).slice(0, 8);
    let html = `หมวด <strong>${cat}</strong> มีคำถามที่คนถามบ่อยแบบนี้ค่ะ ลองเลือกดูได้เลยนะคะ`;
    html += `<div class="suggestions">`;
    items.forEach(it => {
      html += `<button data-idx="${VACCINE_QA.indexOf(it)}">${it.q}</button>`;
    });
    html += `</div>`;
    const row = addBotMessageInstant(html);
    bindSuggestionButtons(row);
  }, 500);
}

async function respondNoMatch() {
  await showProcessing(2);
  let html = `${pick(NO_MATCH_OPENERS)} ลองถามด้วยคำอื่น หรือเลือกหมวดที่สนใจด้านล่างนี้ดูไหมคะ`;
  html += `<div class="suggestions">`;
  categories.forEach(c => {
    html += `<button data-cat="${c}">${c}</button>`;
  });
  html += `</div>`;
  const row = addBotMessageInstant(html);
  bindSuggestionButtons(row);
}

function respondSmallTalk(replyBank) {
  showDotTyping();
  setTimeout(() => {
    hideDotTyping();
    addBotMessageInstant(pick(replyBank));
  }, 450);
}

// ---------- Main query handler ----------
function handleQuery(rawText) {
  const text = rawText.trim();
  if (isGreeting(text)) return respondSmallTalk(GREETING_REPLIES);
  if (isThanks(text)) return respondSmallTalk(THANKS_REPLIES);
  if (isBye(text)) return respondSmallTalk(BYE_REPLIES);

  const results = fuse.search(text);
  if (results.length === 0) {
    logQuestion(text, 'no_match', null, undefined);
    return respondNoMatch();
  }

  const best = results[0];
  const uncertain = best.score > 0.32;
  logQuestion(text, uncertain ? 'uncertain' : 'matched', best.item, best.score);
  runAnswerFlow(best.item, uncertain);
}

function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  addUserMessage(text);
  chatInput.value = '';
  handleQuery(text);
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
