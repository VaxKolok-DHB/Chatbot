<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaxKolok ChatBot | ถาม-ตอบเรื่องวัคซีนเด็กและผู้ใหญ่</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f766e'/%3E%3Cg fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m18 5 1 1'/%3E%3Cpath d='m16.5 8.5 2-2'/%3E%3Cpath d='M18.5 10 9 19.5c-.8.8-2 .8-2.8 0l-.7-.7c-.8-.8-.8-2 0-2.8L15 6.5'/%3E%3Cpath d='m9.5 12.5 3 3'/%3E%3Cpath d='m6 17-2 2'/%3E%3Cpath d='m13.5 5.5 5 5'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --primary:#0f766e;
    --primary-dark:#0b5b54;
    --primary-light:#ccfbf1;
    --bg:#eef4f3;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --user-bubble:#0f766e;
    --bot-bubble:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Sarabun','Noto Sans Thai','Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    display:flex;
    flex-direction:column;
  }
  a{color:var(--primary-dark);}

  header.site-header{
    background:linear-gradient(135deg,var(--primary) 0%,#134e4a 100%);
    color:#fff;
    padding:14px 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    flex-shrink:0;
  }
  .header-inner{
    max-width:820px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-icon{
    width:38px;height:38px;
    background:#fff;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:var(--primary);
    flex-shrink:0;
  }
  .brand-icon svg{width:20px;height:20px;}
  .brand-text h1{
    font-size:16px;margin:0;font-weight:700;
  }
  .brand-text p{
    margin:1px 0 0;font-size:12px;opacity:.85;
  }
  .status-pill{
    margin-inline-start:auto;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    opacity:.9;
  }
  .status-pill .dot{
    width:8px;height:8px;border-radius:50%;background:#4ade80;
  }

  main.chat-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:820px;
    width:100%;
    margin:0 auto;
    min-height:0;
  }

  .chat-messages{
    flex:1;
    overflow-y:auto;
    padding:22px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg-row{
    display:flex;
    gap:8px;
    align-items:flex-end;
  }
  .msg-row.user{justify-content:flex-end;}
  .avatar{
    width:30px;height:30px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .avatar svg{width:16px;height:16px;}
  .msg{
    max-width:78%;
    padding:12px 15px;
    border-radius:16px;
    font-size:14.5px;
    white-space:pre-wrap;
    animation:fadeIn .25s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .msg.bot{
    background:var(--bot-bubble);
    color:var(--text);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg.user{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg .src{
    display:block;
    margin-top:10px;
    padding-top:8px;
    border-top:1px dashed #cbd5e1;
    font-size:12px;
    color:var(--muted);
  }
  .msg .src a{color:var(--primary-dark);font-weight:600;}
  .msg .cat-tag{
    display:inline-block;
    background:var(--primary-light);
    color:var(--primary-dark);
    font-size:10.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    margin-bottom:6px;
  }
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
  }
  .suggestions button{
    background:#fff;
    border:1px solid var(--border);
    color:var(--primary-dark);
    padding:6px 12px;
    border-radius:999px;
    font-size:12.5px;
    cursor:pointer;
    transition:.15s;
  }
  .suggestions button:hover{
    background:var(--primary-light);
    border-color:var(--primary);
  }
  .typing-row .msg.bot{
    display:flex;
    gap:4px;
    padding:14px 16px;
    align-items:center;
  }
  .typing-row .msg.bot span{
    width:7px;height:7px;background:#94a3b8;border-radius:50%;
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing-row .msg.bot span:nth-child(2){animation-delay:.15s;}
  .typing-row .msg.bot span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}

  .processing-row .msg.bot{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px 16px;
    font-size:13px;
    color:var(--muted);
    font-style:italic;
    background:#f8fafc;
  }
  .spinner{
    width:14px;height:14px;
    border:2px solid #cbd5e1;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .processing-text{transition:opacity .15s ease;}

  .msg.bot.note-bubble{
    font-size:12.5px;
    color:var(--muted);
    padding:9px 14px;
    background:#f8fafc;
  }
  .msg.bot.note-bubble a{color:var(--primary-dark);font-weight:600;}

  .quick-bar{
    padding:0 16px 6px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .quick-bar button{
    background:#fff;
    border:1px solid var(--border);
    color:var(--primary-dark);
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
  }
  .quick-bar button:hover{background:var(--primary-light);}

  .chat-input-area{
    flex-shrink:0;
    background:#fff;
    border-top:1px solid var(--border);
    padding:12px 16px;
  }
  .chat-input-row{
    display:flex;
    gap:10px;
    max-width:820px;
    margin:0 auto;
  }
  .chat-input-row input{
    flex:1;
    padding:13px 16px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:14.5px;
    font-family:inherit;
    outline:none;
    background:#f8fafc;
  }
  .chat-input-row input:focus{border-color:var(--primary);background:#fff;}
  .chat-input-row button{
    background:var(--primary);
    color:#fff;
    border:none;
    width:46px;height:46px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    transition:.15s;
    flex-shrink:0;
  }
  .chat-input-row button:hover{background:var(--primary-dark);}
  .chat-input-row button:disabled{opacity:.5;cursor:not-allowed;}
  .disclaimer-line{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg></div>
    <div class="brand-text">
      <h1>VaxKolok ChatBot</h1>
      <p>ถามได้ทุกเรื่องเกี่ยวกับวัคซีนเด็กและผู้ใหญ่</p>
    </div>
    <div class="status-pill"><span class="dot"></span> ออนไลน์</div>
  </div>
</header>

<main class="chat-wrap">
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-area">
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="พิมพ์ข้อความ..." autocomplete="off">
      <button id="sendBtn" title="ส่ง">➤</button>
    </div>
    <div class="disclaimer-line">ข้อมูลเพื่อการศึกษาทั่วไป ไม่ใช่คำวินิจฉัยทางการแพทย์ หากมีข้อสงสัยเฉพาะบุคคลควรปรึกษาแพทย์</div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script>
